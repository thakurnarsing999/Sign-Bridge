<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141f36"/>
      <stop offset="60%" stop-color="#090e1c"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Cinema Studio Background -->
  <rect width="600" height="600" fill="url(#bgGlow)"/>

  <!-- Subtle Studio Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
  </g>

  <!-- Human Signer Silhouette Torso -->
  <path d="M 170 560 C 180 430 220 370 260 350 L 260 270 C 260 250 280 230 300 230 C 320 230 340 250 340 270 L 340 350 C 380 370 420 430 430 560 Z" fill="rgba(30, 41, 59, 0.65)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  
  <!-- Optical Viewfinder Brackets -->
  <g stroke="rgba(124, 58, 237, 0.5)" stroke-width="3" fill="none">
    <path d="M 40 70 L 40 40 L 70 40"/>
    <path d="M 530 40 L 560 40 L 560 70"/>
    <path d="M 40 530 L 40 560 L 70 560"/>
    <path d="M 530 560 L 560 560 L 560 530"/>
  </g>

  <!-- Technical ISL Standard Tag -->
  <rect x="40" y="36" width="130" height="28" rx="8" fill="rgba(124, 58, 237, 0.18)" stroke="rgba(124, 58, 237, 0.4)" stroke-width="1.5"/>
  <text x="105" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#c4b5fd" text-anchor="middle" letter-spacing="1">ISLRTC CORPUS</text>

  <!-- Sign Hand Graphics Visual Layer -->
  
      <g transform="translate(230, 280)">
        <circle cx="0" cy="0" r="55" fill="none" stroke="#f1f5f9" stroke-width="26"/>
        <circle cx="0" cy="0" r="55" fill="none" stroke="#0f172a" stroke-width="4"/>
        <path d="M -35 -40 L -60 -110 Q -50 -120 -30 -110 L -10 -50" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
        <path d="M -15 -45 L -20 -120 Q -5 -130 10 -120 L 5 -50" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
      </g>
      <g transform="translate(340, 280)">
        <circle cx="0" cy="0" r="55" fill="none" stroke="#f1f5f9" stroke-width="26"/>
        <circle cx="0" cy="0" r="55" fill="none" stroke="#0f172a" stroke-width="4"/>
        <path d="M 15 -45 L 20 -120 Q 5 -130 -10 -120 L -5 -50" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
        <path d="M 35 -40 L 60 -110 Q 50 -120 30 -110 L 10 -50" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
      </g>
      <circle cx="285" cy="280" r="16" fill="rgba(124, 58, 237, 0.3)" stroke="#7c3aed" stroke-width="4"/>
      <circle cx="285" cy="280" r="6" fill="#7c3aed"/>
    

  <!-- Bottom Title & Instruction Plate -->
  <rect x="40" y="470" width="520" height="88" rx="16" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Letter Badge -->
  <rect x="58" y="488" width="52" height="52" rx="14" fill="url(#violetGrad)"/>
  <text x="84" y="525" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
  
  <text x="124" y="508" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">ISL Sign 'B' — Two-Handed Consonant</text>
  <text x="124" y="532" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#cbd5e1">Both hands form circles touching to create dual circular loops (glasses / 8)</text>
</svg>